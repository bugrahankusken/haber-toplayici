name: Haftalik haber toplama
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: haber
  cancel-in-progress: false
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python haber_topla.py
      - name: Arsivle ve kaydet
        run: |
          mkdir -p arsiv
          cp haberler.json "arsiv/haberler_$(date +%Y%m%d).json"
          git config user.name "haber-bot"
          git config user.email "haber-bot@users.noreply.github.com"
          git add haberler.json arsiv
          git commit -m "Haftalik haber verisi" || echo "degisiklik yok"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
